{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="p-3">
  <div class="container">

    <!-- Header + Map Button -->
    <div class="row mt-3 align-items-center">
      <div class="col">
        <h2>List of Movies</h2>
      </div>
      <div class="col-auto">
        <a href="{% url 'movies.popularity_map' %}" class="btn bg-dark text-white">
          Local Popularity Map
        </a>
      </div>
    </div>
    <hr />

    <!-- Search -->
    <div class="row mb-3">
      <div class="col">
        <form method="GET" class="d-flex gap-2">
          <div class="input-group" style="max-width: 420px;">
            <span class="input-group-text">Search</span>
            <input type="text" class="form-control" name="search" value="{{ request.GET.search }}">
          </div>
          <button class="btn bg-dark text-white" type="submit">Search</button>
        </form>
      </div>
    </div>

    <!-- Movies Grid -->
    <div class="row">
      {% for movie in template_data.movies %}
        <div class="col-md-4 col-lg-3 mb-3">
          <div class="card p-2 align-items-center pt-4">
            <img src="{{ movie.image.url }}" class="card-img-top rounded img-card-200" alt="{{ movie.name }}">
            <div class="card-body text-center">
              <a href="{% url 'movies.show' id=movie.id %}" class="btn bg-dark text-white">
                {{ movie.name }}
              </a>
              {% if movie.price %}
                <div class="mt-2 text-muted">${{ movie.price }}</div>
              {% endif %}
            </div>
          </div>
        </div>
      {% empty %}
        <div class="col-12">
          <div class="alert alert-secondary">No movies found.</div>
        </div>
      {% endfor %}
    </div>

  </div>
</div>
{% endblock content %}
